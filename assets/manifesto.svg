<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" role="img">
  <defs>
    
  </defs>
  <rect width="1280" height="200" fill="#0A0A08"></rect>

  
  <text x="40" y="34" class="mono" font-size="10" fill="#F5B14C" letter-spacing="3">▸ MANIFIESTO · OPERATING PRINCIPLES</text>
  <line x1="40" y1="46" x2="1240" y2="46" stroke="#2A2A24"></line>

  
  <g transform="translate(40, 70)">
    <g>
      <text class="serif" font-size="72" fill="#F5B14C" font-style="italic" letter-spacing="-2">01</text>
      <line x1="0" y1="78" x2="270" y2="78" stroke="#2A2A24"></line>
      <text class="sans" font-size="14" fill="#F5F1E8" y="98" font-weight="500">Si es medible, es mejorable.</text>
      <text class="sans" font-size="11" fill="#9A968A" y="118">No optimizo lo que no puedo verificar.</text>
    </g>

    <g transform="translate(300, 0)">
      <text class="serif" font-size="72" fill="#F5B14C" font-style="italic" letter-spacing="-2">02</text>
      <line x1="0" y1="78" x2="270" y2="78" stroke="#2A2A24"></line>
      <text class="sans" font-size="14" fill="#F5F1E8" y="98" font-weight="500">Método antes que herramienta.</text>
      <text class="sans" font-size="11" fill="#9A968A" y="118">El stack cambia, el proceso PHVA persiste.</text>
    </g>

    <g transform="translate(600, 0)">
      <text class="serif" font-size="72" fill="#F5B14C" font-style="italic" letter-spacing="-2">03</text>
      <line x1="0" y1="78" x2="270" y2="78" stroke="#2A2A24"></line>
      <text class="sans" font-size="14" fill="#F5F1E8" y="98" font-weight="500">Agentes, no asistentes.</text>
      <text class="sans" font-size="11" fill="#9A968A" y="118">Delegación con verificación, no chat con prompts.</text>
    </g>

    <g transform="translate(900, 0)">
      <text class="serif" font-size="72" fill="#F5B14C" font-style="italic" letter-spacing="-2">04</text>
      <line x1="0" y1="78" x2="270" y2="78" stroke="#2A2A24"></line>
      <text class="sans" font-size="14" fill="#F5F1E8" y="98" font-weight="500">El contexto es el activo.</text>
      <text class="sans" font-size="11" fill="#9A968A" y="118">Memoria persistente &gt; modelo más potente.</text>
    </g>
  </g>
</svg>