<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="ISO 50001 — Autodiagnóstico de eficiencia energética">
  <style>
    .fg{fill:#F5F1E8}.fg-dim{fill:#B5B0A4}.muted{fill:#7A776E}.faint{fill:#5A5750}
    .stk-fg{stroke:#F5F1E8}.stk-mut{stroke:#3A3A33}.stk-bord{stroke:#2A2A24}.stk-acc{stroke:#F5B14C}
    .accent{fill:#F5B14C}.accent-soft{fill:#F5B14C;fill-opacity:.12}.green{fill:#7AB87A}
    .panel{fill:#15140F;fill-opacity:.55}.chip{fill:#1A1A16;fill-opacity:.6}
    .serif{font-family:"Instrument Serif",Georgia,serif}
    .sans{font-family:"Inter","Helvetica Neue",sans-serif}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
    @media (prefers-color-scheme: light){
      .fg{fill:#1c1917}.fg-dim{fill:#44403c}.muted{fill:#78716c}.faint{fill:#a8a29e}
      .stk-fg{stroke:#1c1917}.stk-mut{stroke:#d6d3d1}.stk-bord{stroke:#e7e5e4}
      .panel{fill:#fafaf9;fill-opacity:.65}.chip{fill:#f5f5f4;fill-opacity:.7}
    }
  </style>
  <rect width="1280" height="280" fill="none"/>

  <!-- Esquinas decorativas -->
  <g fill="none" class="stk-mut" stroke-width="1">
    <path d="M 16 16 L 16 40 M 16 16 L 40 16"/>
    <path d="M 1264 16 L 1264 40 M 1264 16 L 1240 16"/>
    <path d="M 16 264 L 16 240 M 16 264 L 40 264"/>
    <path d="M 1264 264 L 1264 240 M 1264 264 L 1240 264"/>
  </g>

  <!-- Stripe de cabecera -->
  <g class="mono" font-size="10" letter-spacing="2">
    <text x="48" y="42" class="accent">▸ HERRAMIENTA · ENERGÍA</text>
    <line x1="200" y1="38" x2="1100" y2="38" class="stk-bord" stroke-width="1"/>
    <text x="1232" y="42" text-anchor="end" class="muted">github.com/ingjaviergomezm/autodiagnostico-eficiencia-energetica</text>
  </g>

  <!-- Título -->
  <g transform="translate(64, 80)">
    <text class="serif fg" font-size="56" letter-spacing="-1.5">ISO</text>
    <text class="serif accent" y="56" font-size="56" letter-spacing="-1.5" font-style="italic">50001<tspan class="fg" font-style="normal">.</tspan></text>
  </g>

  <!-- Subtítulo -->
  <text x="64" y="156" class="serif fg-dim" font-size="20" font-style="italic">Autodiagnóstico de eficiencia energética</text>

  <!-- Descripción 2-3 líneas -->
  <text x="64" y="178" class="sans fg-dim" font-size="13">Herramienta web interactiva para que organizaciones industriales evalúen su nivel de madurez</text>
      <text x="64" y="196" class="sans fg-dim" font-size="13">en gestión energética bajo ISO 50001. Cuestionario por dominios + scoring + roadmap accionable</text>
      <text x="64" y="214" class="sans fg-dim" font-size="13">alineado con el ciclo PHVA de la norma.</text>

  <!-- Chips de tags (esquina inferior izq) -->
  <g transform="translate(0, 226)">
      <g transform="translate(64,0)"><rect width="75" height="22" rx="2" class="chip"/><rect width="75" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="37.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">ISO 50001</text></g>
      <g transform="translate(147,0)"><rect width="159" height="22" rx="2" class="chip"/><rect width="159" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="79.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Eficiencia Energética</text></g>
      <g transform="translate(314,0)"><rect width="82" height="22" rx="2" class="chip"/><rect width="82" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="41.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Industrial</text></g>
  </g>

  <!-- Motivo visual lado derecho -->
  <g transform="translate(820, 60)">
    <g>
    <!-- Gauge -->
    <g transform="translate(180, 100)">
      <path d="M -100 0 A 100 100 0 0 1 100 0" fill="none" class="stk-bord" stroke-width="14"/>
      <path d="M -100 0 A 100 100 0 0 1 50 -86.6" fill="none" class="stk-acc" stroke-width="14" stroke-linecap="round"/>
      <text y="-30" text-anchor="middle" class="serif accent" font-size="48" font-style="italic">82</text>
      <text y="-8" text-anchor="middle" class="mono muted" font-size="10" letter-spacing="2">% MADUREZ</text>
    </g>
    <!-- Etiquetas -->
    <g transform="translate(80, 110)" class="mono fg-dim" font-size="10" letter-spacing="1">
      <text x="0" y="56">PLANIFICAR</text>
      <text x="0" y="74">HACER</text>
      <text x="0" y="92">VERIFICAR</text>
      <text x="0" y="110">ACTUAR</text>
    </g>
    <text x="0" y="158" class="mono muted" font-size="10" letter-spacing="2">▸ ISO 50001 · MADUREZ ENERGÉTICA</text>
  </g>
  </g>
</svg>