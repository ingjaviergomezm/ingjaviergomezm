<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="ISO 14224 — Dashboard de mantenimiento & confiabilidad">
  <style>
    .fg{fill:#F5F1E8}.fg-dim{fill:#B5B0A4}.muted{fill:#7A776E}.faint{fill:#5A5750}
    .stk-fg{stroke:#F5F1E8}.stk-mut{stroke:#3A3A33}.stk-bord{stroke:#2A2A24}.stk-acc{stroke:#F5B14C}
    .accent{fill:#F5B14C}.accent-soft{fill:#F5B14C;fill-opacity:.12}.green{fill:#7AB87A}
    .panel{fill:#15140F;fill-opacity:.55}.chip{fill:#1A1A16;fill-opacity:.6}
    .serif{font-family:"Instrument Serif",Georgia,serif}
    .sans{font-family:"Inter","Helvetica Neue",sans-serif}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
    @media (prefers-color-scheme: light){
      .fg{fill:#1c1917}.fg-dim{fill:#44403c}.muted{fill:#78716c}.faint{fill:#a8a29e}
      .stk-fg{stroke:#1c1917}.stk-mut{stroke:#d6d3d1}.stk-bord{stroke:#e7e5e4}
      .panel{fill:#fafaf9;fill-opacity:.65}.chip{fill:#f5f5f4;fill-opacity:.7}
    }
  </style>
  <rect width="1280" height="280" fill="none"/>

  <!-- Esquinas decorativas -->
  <g fill="none" class="stk-mut" stroke-width="1">
    <path d="M 16 16 L 16 40 M 16 16 L 40 16"/>
    <path d="M 1264 16 L 1264 40 M 1264 16 L 1240 16"/>
    <path d="M 16 264 L 16 240 M 16 264 L 40 264"/>
    <path d="M 1264 264 L 1264 240 M 1264 264 L 1240 264"/>
  </g>

  <!-- Stripe de cabecera -->
  <g class="mono" font-size="10" letter-spacing="2">
    <text x="48" y="42" class="accent">▸ DASHBOARD · DATA</text>
    <line x1="200" y1="38" x2="1100" y2="38" class="stk-bord" stroke-width="1"/>
    <text x="1232" y="42" text-anchor="end" class="muted">github.com/ingjaviergomezm/dashboard_mantenimiento_y_confiabilidad_iso14224</text>
  </g>

  <!-- Título -->
  <g transform="translate(64, 80)">
    <text class="serif fg" font-size="56" letter-spacing="-1.5">ISO</text>
    <text class="serif accent" y="56" font-size="56" letter-spacing="-1.5" font-style="italic">14224<tspan class="fg" font-style="normal">.</tspan></text>
  </g>

  <!-- Subtítulo -->
  <text x="64" y="156" class="serif fg-dim" font-size="20" font-style="italic">Dashboard de mantenimiento & confiabilidad</text>

  <!-- Descripción 2-3 líneas -->
  <text x="64" y="178" class="sans fg-dim" font-size="13">Tablero analítico Power BI alineado con la taxonomía ISO 14224 para seguimiento de activos,</text>
      <text x="64" y="196" class="sans fg-dim" font-size="13">modos de falla y desempeño operacional. KPIs de MTBF, MTTR y disponibilidad por equipo,</text>
      <text x="64" y="214" class="sans fg-dim" font-size="13">con drill-down jerárquico y comparativos por planta y período.</text>

  <!-- Chips de tags (esquina inferior izq) -->
  <g transform="translate(0, 226)">
      <g transform="translate(64,0)"><rect width="68" height="22" rx="2" class="chip" stroke-width="1" class="stk-bord"/><rect width="68" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="34.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Power BI</text></g>
      <g transform="translate(140,0)"><rect width="75" height="22" rx="2" class="chip" stroke-width="1" class="stk-bord"/><rect width="75" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="37.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">ISO 14224</text></g>
      <g transform="translate(223,0)"><rect width="103" height="22" rx="2" class="chip" stroke-width="1" class="stk-bord"/><rect width="103" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="51.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Confiabilidad</text></g>
      <g transform="translate(334,0)"><rect width="110" height="22" rx="2" class="chip" stroke-width="1" class="stk-bord"/><rect width="110" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="55.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Data Analytics</text></g>
  </g>

  <!-- Motivo visual lado derecho -->
  <g transform="translate(820, 60)">
    <g>
    <g class="stk-bord" stroke-width="1" fill="none">
      <line x1="0" y1="160" x2="380" y2="160"/>
      <line x1="0" y1="0" x2="0" y2="160"/>
    </g>
    <g class="accent">
      <rect x="14" y="100" width="20" height="60" fill-opacity="0.5"/>
      <rect x="44" y="80"  width="20" height="80" fill-opacity="0.65"/>
      <rect x="74" y="60"  width="20" height="100" fill-opacity="0.7"/>
      <rect x="104" y="40" width="20" height="120" fill-opacity="0.85"/>
      <rect x="134" y="56" width="20" height="104" fill-opacity="0.6"/>
      <rect x="164" y="74" width="20" height="86" fill-opacity="0.55"/>
      <rect x="194" y="44" width="20" height="116" fill-opacity="0.8"/>
      <rect x="224" y="62" width="20" height="98" fill-opacity="0.62"/>
      <rect x="254" y="36" width="20" height="124" fill-opacity="0.9"/>
      <rect x="284" y="20" width="20" height="140" fill-opacity="0.75"/>
      <rect x="314" y="50" width="20" height="110" fill-opacity="0.55"/>
      <rect x="344" y="32" width="20" height="128" fill-opacity="0.7"/>
    </g>
    <!-- Línea de tendencia -->
    <polyline points="24,110 54,90 84,70 114,50 144,66 174,84 204,54 234,72 264,46 294,30 324,60 354,42" fill="none" class="stk-fg" stroke-width="1.5" stroke-dasharray="3 2"/>
    <g class="mono muted" font-size="9" letter-spacing="2">
      <text x="0" y="180">▸ MTBF · MTTR · DISPONIBILIDAD · 12 ACTIVOS</text>
    </g>
  </g>
  </g>
</svg>