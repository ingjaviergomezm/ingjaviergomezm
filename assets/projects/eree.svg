<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="Especialista en EREE — Tres skills de campo para energía">
  <style>
    .fg{fill:#F5F1E8}.fg-dim{fill:#B5B0A4}.muted{fill:#7A776E}.faint{fill:#5A5750}
    .stk-fg{stroke:#F5F1E8}.stk-mut{stroke:#3A3A33}.stk-bord{stroke:#2A2A24}.stk-acc{stroke:#F5B14C}.stk-green{stroke:#7AB87A}
    .accent{fill:#F5B14C}.accent-soft{fill:#F5B14C;fill-opacity:.12}.green{fill:#7AB87A}
    .panel{fill:#15140F;fill-opacity:.55}.chip{fill:#1A1A16;fill-opacity:.6}
    .serif{font-family:"Instrument Serif",Georgia,serif}
    .sans{font-family:"Inter","Helvetica Neue",sans-serif}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
    @media (prefers-color-scheme: light){
      .fg{fill:#1c1917}.fg-dim{fill:#44403c}.muted{fill:#78716c}.faint{fill:#a8a29e}
      .stk-fg{stroke:#1c1917}.stk-mut{stroke:#d6d3d1}.stk-bord{stroke:#e7e5e4}
      .panel{fill:#fafaf9;fill-opacity:.65}.chip{fill:#f5f5f4;fill-opacity:.7}
    }
  </style>
  <rect width="1280" height="280" fill="none"/>

  <g fill="none" class="stk-mut" stroke-width="1">
    <path d="M 16 16 L 16 40 M 16 16 L 40 16"/>
    <path d="M 1264 16 L 1264 40 M 1264 16 L 1240 16"/>
    <path d="M 16 264 L 16 240 M 16 264 L 40 264"/>
    <path d="M 1264 264 L 1264 240 M 1264 264 L 1240 264"/>
  </g>

  <g class="mono" font-size="10" letter-spacing="2">
    <text x="48" y="42" class="accent">▸ CASE STUDY · ENERGÍA × IA</text>
    <line x1="230" y1="38" x2="1060" y2="38" class="stk-bord" stroke-width="1"/>
    <text x="1232" y="42" text-anchor="end" class="muted">github.com/ingjaviergomezm/Especialista_en_EREE</text>
  </g>

  <g transform="translate(64, 94)">
    <text class="serif fg" font-size="46" letter-spacing="-1.2">Especialista</text>
    <text class="serif accent" y="44" font-size="46" letter-spacing="-1.2" font-style="italic">en EREE<tspan class="fg" font-style="normal">.</tspan></text>
  </g>

  <text x="64" y="156" class="serif fg-dim" font-size="20" font-style="italic">Tres skills de Claude para trabajo de campo en energía</text>

  <text x="64" y="178" class="sans fg-dim" font-size="13">Prefactibilidad renovable, auditoría ISO 50001 y mercado eléctrico colombiano con humano en el</text>
  <text x="64" y="196" class="sans fg-dim" font-size="13">ciclo: entrevista, supuestos aprobados, norma verificada en vivo y compuertas antes de entregar.</text>
  <text x="64" y="214" class="sans fg-dim" font-size="13">149 pruebas reproducen los ejercicios de los profesores; un red team independiente auditó el método.</text>

  <g transform="translate(0, 226)">
    <g transform="translate(64,0)"><rect width="96" height="22" rx="2" class="chip"/><rect width="96" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="48" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Renovables</text></g>
    <g transform="translate(168,0)"><rect width="76" height="22" rx="2" class="chip"/><rect width="76" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="38" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">ISO 50001</text></g>
    <g transform="translate(252,0)"><rect width="88" height="22" rx="2" class="chip"/><rect width="88" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="44" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">CREG · XM</text></g>
    <g transform="translate(348,0)"><rect width="96" height="22" rx="2" class="chip"/><rect width="96" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="48" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Claude Skills</text></g>
    <g transform="translate(452,0)"><rect width="60" height="22" rx="2" class="chip"/><rect width="60" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="30" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Python</text></g>
  </g>

  <!-- Motivo: tres módulos conectados por compuertas -->
  <g transform="translate(800, 70)">
    <g class="mono" font-size="10" letter-spacing="1">
      <rect x="0" y="0" width="128" height="44" rx="2" class="panel"/><rect x="0" y="0" width="128" height="44" rx="2" fill="none" class="stk-acc" stroke-width="1.2"/>
      <text x="64" y="27" text-anchor="middle" class="accent">proyectos-er</text>

      <rect x="164" y="0" width="128" height="44" rx="2" class="panel"/><rect x="164" y="0" width="128" height="44" rx="2" fill="none" class="stk-acc" stroke-width="1.2"/>
      <text x="228" y="27" text-anchor="middle" class="accent">gestion-energ.</text>

      <rect x="328" y="0" width="128" height="44" rx="2" class="panel"/><rect x="328" y="0" width="128" height="44" rx="2" fill="none" class="stk-acc" stroke-width="1.2"/>
      <text x="392" y="27" text-anchor="middle" class="accent">mercado-co</text>
    </g>
    <!-- fases 0–5 con compuertas -->
    <g transform="translate(0, 84)">
      <line x1="10" y1="10" x2="446" y2="10" class="stk-mut" stroke-width="1"/>
      <g class="mono" font-size="9" letter-spacing="1">
        <circle cx="10" cy="10" r="5" class="accent"/><text x="10" y="32" text-anchor="middle" class="muted">0</text>
        <circle cx="97" cy="10" r="5" class="accent"/><text x="97" y="32" text-anchor="middle" class="muted">1</text>
        <circle cx="184" cy="10" r="5" class="accent"/><text x="184" y="32" text-anchor="middle" class="muted">2</text>
        <circle cx="271" cy="10" r="5" class="accent"/><text x="271" y="32" text-anchor="middle" class="muted">3</text>
        <circle cx="358" cy="10" r="5" class="accent"/><text x="358" y="32" text-anchor="middle" class="muted">4</text>
        <circle cx="446" cy="10" r="5" class="green"/><text x="446" y="32" text-anchor="middle" class="muted">5</text>
      </g>
      <g class="stk-green" stroke-width="1.4" fill="none">
        <path d="M 50 4 L 50 16 M 56 4 L 56 16"/>
        <path d="M 137 4 L 137 16 M 143 4 L 143 16"/>
        <path d="M 311 4 L 311 16 M 317 4 L 317 16"/>
        <path d="M 398 4 L 398 16 M 404 4 L 404 16"/>
      </g>
    </g>
    <g transform="translate(0, 150)" class="mono muted" font-size="10" letter-spacing="1">
      <text>fases 0–5 · ║ compuerta humana · 149 tests · norma 2026-11</text>
    </g>
  </g>
</svg>
