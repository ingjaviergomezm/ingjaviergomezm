<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="Solar planner — Planificador técnico-financiero FV">
  <style>
    .fg{fill:#F5F1E8}.fg-dim{fill:#B5B0A4}.muted{fill:#7A776E}.faint{fill:#5A5750}
    .stk-fg{stroke:#F5F1E8}.stk-mut{stroke:#3A3A33}.stk-bord{stroke:#2A2A24}.stk-acc{stroke:#F5B14C}
    .accent{fill:#F5B14C}.accent-soft{fill:#F5B14C;fill-opacity:.12}.green{fill:#7AB87A}
    .panel{fill:#15140F;fill-opacity:.55}.chip{fill:#1A1A16;fill-opacity:.6}
    .serif{font-family:"Instrument Serif",Georgia,serif}
    .sans{font-family:"Inter","Helvetica Neue",sans-serif}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
    @media (prefers-color-scheme: light){
      .fg{fill:#1c1917}.fg-dim{fill:#44403c}.muted{fill:#78716c}.faint{fill:#a8a29e}
      .stk-fg{stroke:#1c1917}.stk-mut{stroke:#d6d3d1}.stk-bord{stroke:#e7e5e4}
      .panel{fill:#fafaf9;fill-opacity:.65}.chip{fill:#f5f5f4;fill-opacity:.7}
    }
  </style>
  <rect width="1280" height="280" fill="none"/>

  <!-- Esquinas decorativas -->
  <g fill="none" class="stk-mut" stroke-width="1">
    <path d="M 16 16 L 16 40 M 16 16 L 40 16"/>
    <path d="M 1264 16 L 1264 40 M 1264 16 L 1240 16"/>
    <path d="M 16 264 L 16 240 M 16 264 L 40 264"/>
    <path d="M 1264 264 L 1264 240 M 1264 264 L 1240 264"/>
  </g>

  <!-- Stripe de cabecera -->
  <g class="mono" font-size="10" letter-spacing="2">
    <text x="48" y="42" class="accent">▸ CASE STUDY · ENERGÍA</text>
    <line x1="200" y1="38" x2="1100" y2="38" class="stk-bord" stroke-width="1"/>
    <text x="1232" y="42" text-anchor="end" class="muted">github.com/ingjaviergomezm/solar-project-planner</text>
  </g>

  <!-- Título -->
  <g transform="translate(64, 80)">
    <text class="serif fg" font-size="56" letter-spacing="-1.5">Solar</text>
    <text class="serif accent" y="56" font-size="56" letter-spacing="-1.5" font-style="italic">planner<tspan class="fg" font-style="normal">.</tspan></text>
  </g>

  <!-- Subtítulo -->
  <text x="64" y="156" class="serif fg-dim" font-size="20" font-style="italic">Planificador técnico-financiero FV</text>

  <!-- Descripción 2-3 líneas -->
  <text x="64" y="178" class="sans fg-dim" font-size="13">Aplicación web para evaluación técnica, económica y financiera de sistemas fotovoltaicos en</text>
      <text x="64" y="196" class="sans fg-dim" font-size="13">Colombia. Modela TIR, payback y autoconsumo bajo supuestos normativos del mercado local</text>
      <text x="64" y="214" class="sans fg-dim" font-size="13">(Ley 1715, esquema tarifario CREG) e incorpora IA para sugerencias de dimensionamiento.</text>

  <!-- Chips de tags (esquina inferior izq) -->
  <g transform="translate(0, 226)">
      <g transform="translate(64,0)"><rect width="103" height="22" rx="2" class="chip"/><rect width="103" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="51.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Energía Solar</text></g>
      <g transform="translate(175,0)"><rect width="68" height="22" rx="2" class="chip"/><rect width="68" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="34.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Finanzas</text></g>
      <g transform="translate(251,0)"><rect width="26" height="22" rx="2" class="chip"/><rect width="26" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="13.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">IA</text></g>
      <g transform="translate(285,0)"><rect width="68" height="22" rx="2" class="chip"/><rect width="68" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="34.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Colombia</text></g>
  </g>

  <!-- Motivo visual lado derecho -->
  <g transform="translate(820, 60)">
    <g>
    <!-- Sol -->
    <circle cx="80" cy="40" r="22" class="accent" fill-opacity="0.85"/>
    <g class="stk-acc" stroke-width="1.2">
      <line x1="80" y1="6" x2="80" y2="-2"/>
      <line x1="80" y1="78" x2="80" y2="86"/>
      <line x1="46" y1="40" x2="38" y2="40"/>
      <line x1="114" y1="40" x2="122" y2="40"/>
      <line x1="56" y1="16" x2="50" y2="10"/>
      <line x1="104" y1="16" x2="110" y2="10"/>
    </g>
    <!-- Panel solar -->
    <g transform="translate(160, 30) skewX(-12)">
      <rect width="220" height="120" fill="none" class="stk-acc" stroke-width="1.2"/>
      <g class="accent">
        <rect x="2" y="2" width="52" height="28" fill-opacity="0.7"/>
        <rect x="56" y="2" width="52" height="28" fill-opacity="0.55"/>
        <rect x="110" y="2" width="52" height="28" fill-opacity="0.85"/>
        <rect x="164" y="2" width="52" height="28" fill-opacity="0.65"/>
        <rect x="2" y="32" width="52" height="28" fill-opacity="0.5"/>
        <rect x="56" y="32" width="52" height="28" fill-opacity="0.7"/>
        <rect x="110" y="32" width="52" height="28" fill-opacity="0.6"/>
        <rect x="164" y="32" width="52" height="28" fill-opacity="0.4"/>
        <rect x="2" y="62" width="52" height="28" fill-opacity="0.85"/>
        <rect x="56" y="62" width="52" height="28" fill-opacity="0.4"/>
        <rect x="110" y="62" width="52" height="28" fill-opacity="0.7"/>
        <rect x="164" y="62" width="52" height="28" fill-opacity="0.55"/>
      </g>
    </g>
    <!-- Indicador kWp -->
    <g transform="translate(20, 130)" class="mono muted" font-size="10" letter-spacing="1">
      <text>5.4 kWp · TIR 18% · 6 años</text>
    </g>
  </g>
  </g>
</svg>