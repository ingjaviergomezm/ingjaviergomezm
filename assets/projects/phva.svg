<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="Memoria PHVA — Framework de resiliencia agéntica">
  <style>
    .fg{fill:#F5F1E8}.fg-dim{fill:#B5B0A4}.muted{fill:#7A776E}.faint{fill:#5A5750}
    .stk-fg{stroke:#F5F1E8}.stk-mut{stroke:#3A3A33}.stk-bord{stroke:#2A2A24}.stk-acc{stroke:#F5B14C}
    .accent{fill:#F5B14C}.accent-soft{fill:#F5B14C;fill-opacity:.12}.green{fill:#7AB87A}
    .panel{fill:#15140F;fill-opacity:.55}.chip{fill:#1A1A16;fill-opacity:.6}
    .serif{font-family:"Instrument Serif",Georgia,serif}
    .sans{font-family:"Inter","Helvetica Neue",sans-serif}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
    @media (prefers-color-scheme: light){
      .fg{fill:#1c1917}.fg-dim{fill:#44403c}.muted{fill:#78716c}.faint{fill:#a8a29e}
      .stk-fg{stroke:#1c1917}.stk-mut{stroke:#d6d3d1}.stk-bord{stroke:#e7e5e4}
      .panel{fill:#fafaf9;fill-opacity:.65}.chip{fill:#f5f5f4;fill-opacity:.7}
    }
  </style>
  <rect width="1280" height="280" fill="none"/>

  <!-- Esquinas decorativas -->
  <g fill="none" class="stk-mut" stroke-width="1">
    <path d="M 16 16 L 16 40 M 16 16 L 40 16"/>
    <path d="M 1264 16 L 1264 40 M 1264 16 L 1240 16"/>
    <path d="M 16 264 L 16 240 M 16 264 L 40 264"/>
    <path d="M 1264 264 L 1264 240 M 1264 264 L 1240 264"/>
  </g>

  <!-- Stripe de cabecera -->
  <g class="mono" font-size="10" letter-spacing="2">
    <text x="48" y="42" class="accent">▸ FRAMEWORK · IA AGÉNTICA</text>
    <line x1="200" y1="38" x2="1100" y2="38" class="stk-bord" stroke-width="1"/>
    <text x="1232" y="42" text-anchor="end" class="muted">github.com/ingjaviergomezm/phva-vectorizado</text>
  </g>

  <!-- Título -->
  <g transform="translate(64, 80)">
    <text class="serif fg" font-size="56" letter-spacing="-1.5">Memoria</text>
    <text class="serif accent" y="56" font-size="56" letter-spacing="-1.5" font-style="italic">PHVA<tspan class="fg" font-style="normal">.</tspan></text>
  </g>

  <!-- Subtítulo -->
  <text x="64" y="156" class="serif fg-dim" font-size="20" font-style="italic">Framework de resiliencia agéntica</text>

  <!-- Descripción 2-3 líneas -->
  <text x="64" y="178" class="sans fg-dim" font-size="13">Manifiesto técnico + skill operativa que implementa el ciclo Plan-Hacer-Verificar-Actuar con</text>
      <text x="64" y="196" class="sans fg-dim" font-size="13">persistencia vectorial asíncrona. Resuelve la amnesia estructural en agentes LLM mediante</text>
      <text x="64" y="214" class="sans fg-dim" font-size="13">destilación de lecciones aprendidas desde logs históricos. Mitigación proactiva, ahorro de tokens.</text>

  <!-- Chips de tags (esquina inferior izq) -->
  <g transform="translate(0, 226)">
      <g transform="translate(64,0)"><rect width="103" height="22" rx="2" class="chip"/><rect width="103" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="51.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">AI Resilience</text></g>
      <g transform="translate(175,0)"><rect width="75" height="22" rx="2" class="chip"/><rect width="75" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="37.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Vector DB</text></g>
      <g transform="translate(258,0)"><rect width="68" height="22" rx="2" class="chip"/><rect width="68" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="34.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">ChromaDB</text></g>
      <g transform="translate(334,0)"><rect width="82" height="22" rx="2" class="chip"/><rect width="82" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="41.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Manifiesto</text></g>
  </g>

  <!-- Motivo visual lado derecho -->
  <g transform="translate(820, 60)">
    <g>
    <g class="stk-acc" stroke-width="1.5" fill="none">
      <circle cx="120" cy="80" r="70"/>
    </g>
    <!-- 4 puntos del ciclo -->
    <g>
      <circle cx="120" cy="10" r="6" class="accent"/>
      <circle cx="190" cy="80" r="6" class="accent" fill-opacity="0.7"/>
      <circle cx="120" cy="150" r="6" class="accent" fill-opacity="0.5"/>
      <circle cx="50" cy="80" r="6" class="accent" fill-opacity="0.85"/>
    </g>
    <g class="mono fg-dim" font-size="11" letter-spacing="2">
      <text x="120" y="-2" text-anchor="middle">P</text>
      <text x="206" y="84">H</text>
      <text x="120" y="170" text-anchor="middle">V</text>
      <text x="32" y="84" text-anchor="end">A</text>
    </g>
    <!-- Flecha exterior -->
    <path d="M 145 25 A 70 70 0 0 1 175 50" fill="none" class="stk-acc" stroke-width="1.5"/>
    <polygon points="172,46 180,52 168,56" class="accent"/>
    <!-- Memoria en el centro -->
    <g transform="translate(96, 60)" class="mono muted" font-size="9" letter-spacing="1">
      <rect width="48" height="40" fill="none" class="stk-bord" stroke-dasharray="2 2"/>
      <text x="24" y="16" text-anchor="middle">VECTOR</text>
      <text x="24" y="30" text-anchor="middle">DB</text>
    </g>
    <text x="260" y="86" class="serif accent" font-size="36" font-style="italic">PHVA</text>
  </g>
  </g>
</svg>