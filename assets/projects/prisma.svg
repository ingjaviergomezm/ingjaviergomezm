<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="Prisma coworker IA — Orquestador multi-agente local">
  <style>
    .fg{fill:#F5F1E8}.fg-dim{fill:#B5B0A4}.muted{fill:#7A776E}.faint{fill:#5A5750}
    .stk-fg{stroke:#F5F1E8}.stk-mut{stroke:#3A3A33}.stk-bord{stroke:#2A2A24}.stk-acc{stroke:#F5B14C}
    .accent{fill:#F5B14C}.accent-soft{fill:#F5B14C;fill-opacity:.12}.green{fill:#7AB87A}
    .panel{fill:#15140F;fill-opacity:.55}.chip{fill:#1A1A16;fill-opacity:.6}
    .serif{font-family:"Instrument Serif",Georgia,serif}
    .sans{font-family:"Inter","Helvetica Neue",sans-serif}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
    @media (prefers-color-scheme: light){
      .fg{fill:#1c1917}.fg-dim{fill:#44403c}.muted{fill:#78716c}.faint{fill:#a8a29e}
      .stk-fg{stroke:#1c1917}.stk-mut{stroke:#d6d3d1}.stk-bord{stroke:#e7e5e4}
      .panel{fill:#fafaf9;fill-opacity:.65}.chip{fill:#f5f5f4;fill-opacity:.7}
    }
  </style>
  <rect width="1280" height="280" fill="none"/>

  <!-- Esquinas decorativas -->
  <g fill="none" class="stk-mut" stroke-width="1">
    <path d="M 16 16 L 16 40 M 16 16 L 40 16"/>
    <path d="M 1264 16 L 1264 40 M 1264 16 L 1240 16"/>
    <path d="M 16 264 L 16 240 M 16 264 L 40 264"/>
    <path d="M 1264 264 L 1264 240 M 1264 264 L 1240 264"/>
  </g>

  <!-- Stripe de cabecera -->
  <g class="mono" font-size="10" letter-spacing="2">
    <text x="48" y="42" class="accent">▸ PROYECTO INSIGNIA · IA AGÉNTICA</text>
    <line x1="200" y1="38" x2="1100" y2="38" class="stk-bord" stroke-width="1"/>
    <text x="1232" y="42" text-anchor="end" class="muted">github.com/ingjaviergomezm/prisma</text>
  </g>

  <!-- Título -->
  <g transform="translate(64, 80)">
    <text class="serif fg" font-size="56" letter-spacing="-1.5">Prisma</text>
    <text class="serif accent" y="56" font-size="56" letter-spacing="-1.5" font-style="italic">coworker IA<tspan class="fg" font-style="normal">.</tspan></text>
  </g>

  <!-- Subtítulo -->
  <text x="64" y="156" class="serif fg-dim" font-size="20" font-style="italic">Orquestador multi-agente local</text>

  <!-- Descripción 2-3 líneas -->
  <text x="64" y="178" class="sans fg-dim" font-size="13">Router Mistral + 5 especialistas (datos, office, research, código, general) coordinados por LangGraph.</text>
      <text x="64" y="196" class="sans fg-dim" font-size="13">Sandbox real, streaming de tokens vía WebSocket, RAG inter-sesional con ChromaDB y self-evolution</text>
      <text x="64" y="214" class="sans fg-dim" font-size="13">de skills tras cada ejecución exitosa. Multi-modelo vía OpenRouter, sin lock-in.</text>

  <!-- Chips de tags (esquina inferior izq) -->
  <g transform="translate(0, 226)">
      <g transform="translate(64,0)"><rect width="75" height="22" rx="2" class="chip" stroke-width="1" class="stk-bord"/><rect width="75" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="37.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">LangGraph</text></g>
      <g transform="translate(147,0)"><rect width="82" height="22" rx="2" class="chip" stroke-width="1" class="stk-bord"/><rect width="82" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="41.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">OpenRouter</text></g>
      <g transform="translate(237,0)"><rect width="54" height="22" rx="2" class="chip" stroke-width="1" class="stk-bord"/><rect width="54" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="27.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Claude</text></g>
      <g transform="translate(299,0)"><rect width="61" height="22" rx="2" class="chip" stroke-width="1" class="stk-bord"/><rect width="61" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="30.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">FastAPI</text></g>
      <g transform="translate(368,0)"><rect width="68" height="22" rx="2" class="chip" stroke-width="1" class="stk-bord"/><rect width="68" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="34.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">ChromaDB</text></g>
  </g>

  <!-- Motivo visual lado derecho -->
  <g transform="translate(820, 60)">
    <g>
    <polygon points="40,40 130,10 130,70" class="accent-soft" stroke-width="1.5" fill-opacity="0.22"/>
    <polygon points="40,40 130,10 130,70" fill="none" class="stk-acc" stroke-width="1.5"/>
    <text x="78" y="46" class="mono accent" font-size="10" letter-spacing="2">PRISMA</text>
    <g class="stk-acc" stroke-width="1" fill="none">
      <line x1="130" y1="10" x2="380" y2="-10"/>
      <line x1="130" y1="25" x2="380" y2="25"/>
      <line x1="130" y1="40" x2="380" y2="60"/>
      <line x1="130" y1="55" x2="380" y2="95"/>
      <line x1="130" y1="70" x2="380" y2="130"/>
    </g>
    <g class="mono fg-dim" font-size="10">
      <text x="386" y="-6">router</text>
      <text x="386" y="29">datos</text>
      <text x="386" y="64">office</text>
      <text x="386" y="99">research</text>
      <text x="386" y="134">código</text>
    </g>
  </g>
  </g>
</svg>