<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="El Camello 16 skills — Stack de agentes especializados">
  <style>
    .fg{fill:#F5F1E8}.fg-dim{fill:#B5B0A4}.muted{fill:#7A776E}.faint{fill:#5A5750}
    .stk-fg{stroke:#F5F1E8}.stk-mut{stroke:#3A3A33}.stk-bord{stroke:#2A2A24}.stk-acc{stroke:#F5B14C}
    .accent{fill:#F5B14C}.accent-soft{fill:#F5B14C;fill-opacity:.12}.green{fill:#7AB87A}
    .panel{fill:#15140F;fill-opacity:.55}.chip{fill:#1A1A16;fill-opacity:.6}
    .serif{font-family:"Instrument Serif",Georgia,serif}
    .sans{font-family:"Inter","Helvetica Neue",sans-serif}
    .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
    @media (prefers-color-scheme: light){
      .fg{fill:#1c1917}.fg-dim{fill:#44403c}.muted{fill:#78716c}.faint{fill:#a8a29e}
      .stk-fg{stroke:#1c1917}.stk-mut{stroke:#d6d3d1}.stk-bord{stroke:#e7e5e4}
      .panel{fill:#fafaf9;fill-opacity:.65}.chip{fill:#f5f5f4;fill-opacity:.7}
    }
  </style>
  <rect width="1280" height="280" fill="none"/>

  <!-- Esquinas decorativas -->
  <g fill="none" class="stk-mut" stroke-width="1">
    <path d="M 16 16 L 16 40 M 16 16 L 40 16"/>
    <path d="M 1264 16 L 1264 40 M 1264 16 L 1240 16"/>
    <path d="M 16 264 L 16 240 M 16 264 L 40 264"/>
    <path d="M 1264 264 L 1264 240 M 1264 264 L 1240 264"/>
  </g>

  <!-- Stripe de cabecera -->
  <g class="mono" font-size="10" letter-spacing="2">
    <text x="48" y="42" class="accent">▸ STACK · IA AGÉNTICA</text>
    <line x1="200" y1="38" x2="1100" y2="38" class="stk-bord" stroke-width="1"/>
    <text x="1232" y="42" text-anchor="end" class="muted">github.com/ingjaviergomezm/el-camello</text>
  </g>

  <!-- Título -->
  <g transform="translate(64, 80)">
    <text class="serif fg" font-size="56" letter-spacing="-1.5">El Camello</text>
    <text class="serif accent" y="56" font-size="56" letter-spacing="-1.5" font-style="italic">16 skills<tspan class="fg" font-style="normal">.</tspan></text>
  </g>

  <!-- Subtítulo -->
  <text x="64" y="156" class="serif fg-dim" font-size="20" font-style="italic">Stack de agentes especializados</text>

  <!-- Descripción 2-3 líneas -->
  <text x="64" y="178" class="sans fg-dim" font-size="13">Arquitectura modular tipo oficina corporativa de 5 pisos con un orquestador-PM al mando.</text>
      <text x="64" y="196" class="sans fg-dim" font-size="13">Cada uno de los 16 agentes ejecuta tareas profesionales: documentos, dashboards, presentaciones,</text>
      <text x="64" y="214" class="sans fg-dim" font-size="13">webapps, arte generativo, MCPs. Demuestra prompting estructurado y diseño modular de agentes.</text>

  <!-- Chips de tags (esquina inferior izq) -->
  <g transform="translate(0, 226)">
      <g transform="translate(64,0)"><rect width="89" height="22" rx="2" class="chip"/><rect width="89" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="44.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Multi-agent</text></g>
      <g transform="translate(161,0)"><rect width="54" height="22" rx="2" class="chip"/><rect width="54" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="27.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Python</text></g>
      <g transform="translate(223,0)"><rect width="33" height="22" rx="2" class="chip"/><rect width="33" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="16.5" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">MCP</text></g>
      <g transform="translate(264,0)"><rect width="54" height="22" rx="2" class="chip"/><rect width="54" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="27.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Skills</text></g>
  </g>

  <!-- Motivo visual lado derecho -->
  <g transform="translate(820, 60)">
    <g>
    <g class="stk-acc" stroke-width="1.2" fill="none">
      <rect x="40" y="0" width="200" height="160"/>
      <line x1="40" y1="32" x2="240" y2="32"/>
      <line x1="40" y1="64" x2="240" y2="64"/>
      <line x1="40" y1="96" x2="240" y2="96"/>
      <line x1="40" y1="128" x2="240" y2="128"/>
    </g>
    <g class="accent">
      <!-- 16 ventanas distribuidas -->
      <rect x="56" y="8" width="14" height="16" fill-opacity="0.7"/>
      <rect x="80" y="8" width="14" height="16" fill-opacity="0.5"/>
      <rect x="104" y="8" width="14" height="16" fill-opacity="0.85"/>
      <rect x="128" y="8" width="14" height="16" fill-opacity="0.6"/>
      <rect x="152" y="8" width="14" height="16" fill-opacity="0.4"/>
      <rect x="56" y="40" width="14" height="16" fill-opacity="0.55"/>
      <rect x="104" y="40" width="14" height="16" fill-opacity="0.75"/>
      <rect x="152" y="40" width="14" height="16" fill-opacity="0.5"/>
      <rect x="200" y="40" width="14" height="16" fill-opacity="0.65"/>
      <rect x="80" y="72" width="14" height="16" fill-opacity="0.7"/>
      <rect x="128" y="72" width="14" height="16" fill-opacity="0.85"/>
      <rect x="176" y="72" width="14" height="16" fill-opacity="0.45"/>
      <rect x="56" y="104" width="14" height="16" fill-opacity="0.6"/>
      <rect x="104" y="104" width="14" height="16" fill-opacity="0.4"/>
      <rect x="152" y="104" width="14" height="16" fill-opacity="0.7"/>
      <rect x="200" y="104" width="14" height="16" fill-opacity="0.55"/>
    </g>
    <g class="mono muted" font-size="9" letter-spacing="2">
      <text x="40" y="180">5 PISOS · 16 SKILLS · 1 ORQUESTADOR</text>
    </g>
    <text x="260" y="80" class="serif accent" font-size="48" letter-spacing="-1">16</text>
  </g>
  </g>
</svg>