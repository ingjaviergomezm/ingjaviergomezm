      <g transform="translate(285,0)"><rect width="68" height="22" rx="2" class="chip" stroke-width="1" class="stk-bord"/><rect width="68" height="22" rx="2" fill="none" stroke-width="1" class="stk-bord"/><text x="34.0" y="15" text-anchor="middle" class="mono fg-dim" font-size="10" letter-spacing="0.5">Legal CO</text></g>
  </g>

