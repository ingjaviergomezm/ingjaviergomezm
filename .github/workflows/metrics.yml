# Referencia: https://github.com/lowlighter/metrics#-documentation
name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]  # Diario a medianoche
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # ── Step 1: Métricas principales de GitHub ──────────────────────
      - name: Generar Métricas Principales
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ingjaviergomezm
          template: classic
          base: repositories, activity
          config_timezone: America/Bogota
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # ── Step 2: PageSpeed (rendimiento de tu sitio web) ─────────────
      - name: Generar Métricas PageSpeed
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-pagespeed.svg
          token: NOT_NEEDED
          user: ingjaviergomezm
          template: classic
          base: ""
          config_timezone: America/Bogota
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://ingjaviergomezm.github.io/  # Usa el sitio web de tu perfil de GitHub
          plugin_pagespeed_detailed: yes       # Muestra FCP, LCP, CLS, etc.
          # plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}  # Opcional pero recomendado
#     plugin_rss_limit: 4
